<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src '__SCRIPT_HASH__'; style-src 'unsafe-inline'; connect-src https: http://127.0.0.1:* http://localhost:*; img-src data:; base-uri 'none'; form-action 'none'">
<title>MERCADO MIGORY recovery tool</title>
<style>
  :root { --ink: #0f2a1e; --muted: #4d6157; --line: #d5e2db; --accent: #1f7a4c; --bad: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink); background: #eaf6fb; }
  main { max-width: 680px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  h2 { font-size: 17px; margin: 26px 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  button { font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; margin: 6px 6px 0 0; }
  button:disabled { opacity: .5; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row.sub { padding: 4px 0 4px 12px; border-top: 0; }
  .row.sub button { font-size: 13px; padding: 6px 10px; background: #fff; color: var(--accent); border: 1px solid var(--line); }
  code { font-size: 13px; }
  #status { margin-top: 14px; font-size: 13px; overflow-wrap: anywhere; }
  #status.bad { color: var(--bad); }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .top select { width: auto; }
  footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top"><h1 id="title">MERCADO MIGORY recovery tool</h1>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select></div>
  <p id="intro"></p>
  <section>
    <label id="l-net" for="net">Network</label>
    <select id="net"><option value="mainnet">Mainnet</option><option value="devnet" selected>Devnet</option><option value="localnet">Localnet</option></select>
    <label id="l-rpc" for="rpc">RPC</label><input id="rpc" autocomplete="off" spellcheck="false">
    <label id="l-program" for="program">Program</label><input id="program" autocomplete="off" spellcheck="false">
    <div id="wallets" style="margin-top:12px"></div>
  </section>
  <section>
    <h2 id="h-yours" style="margin-top:0">Your listings</h2>
    <div id="listings"></div>
  </section>
  <section>
    <h2 id="h-offers" style="margin-top:0">Your offers</h2>
    <div id="offers"></div>
  </section>
  <section>
    <h2 id="h-swaps" style="margin-top:0">Your swap offers</h2>
    <div id="swaps"></div>
  </section>
  <section>
    <h2 id="h-swapby" style="margin-top:0">Finish a swap offer</h2>
    <p id="swapby-help"></p>
    <label id="l-swap-addr" for="swap-addr">Swap offer address</label><input id="swap-addr" autocomplete="off" spellcheck="false">
    <button id="find">Find it</button>
    <div id="swap-found"></div>
  </section>
  <section>
    <h2 id="h-stale" style="margin-top:0">Close a stale listing</h2>
    <p id="stale-help"></p>
    <label id="l-asset" for="asset">Item address</label><input id="asset" autocomplete="off" spellcheck="false">
    <button id="close">Close it</button>
  </section>
  <div id="status" role="status"></div>
  <footer>Version __VERSION__ · built from the public source; compare this file's SHA-256 with the published release before use.</footer>
</main>
<script>__SCRIPT__</script>
</body>
</html>
